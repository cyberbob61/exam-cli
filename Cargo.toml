[package]
name = "exam-cli"
version = "0.4.0"
edition = "2021"
description = "Console exam trainer in the style of a Pearson VUE exam (training mode)"

[dependencies]
base64 = "0.22"
crossterm = "0.28"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
strip = true
