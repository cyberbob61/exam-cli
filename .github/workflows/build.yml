# Checks the web page and builds the Android app on every push to master; a v* tag also publishes a release
# with exam.html and the APK.
name: build

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  # file names: exam-v0.4.2-android.apk on a tag, exam-dev-android.apk otherwise
  VER: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}

jobs:
  # the web version is one file that needs no build; its exam reading and answer rules are checked under node
  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: node web/check-parser.js
      - uses: actions/upload-artifact@v4
        with: { name: web, path: web/exam.html }

  # Android app in android/ (Kotlin + Compose). Signed with the permanent key from the repo secrets, so a new
  # APK installs over the old one; the build number (versionCode) is the run number.
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: signing key
        env: { KEYSTORE: '${{ secrets.ANDROID_KEYSTORE }}' }
        run: |
          [ -n "$KEYSTORE" ] || { echo "no signing key secret, using the debug key"; exit 0; }
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/exam.p12"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/exam.p12" >> "$GITHUB_ENV"
      - run: gradle -p android testDebugUnitTest assembleDebug --no-daemon
        env: { ANDROID_KEYSTORE_PASSWORD: '${{ secrets.ANDROID_KEYSTORE_PASSWORD }}' }
      - name: package
        run: cp android/app/build/outputs/apk/debug/app-debug.apk "exam-$VER-android.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: '*.apk' }

  # every master build replaces the "android-latest" pre-release; the app checks it on start and offers the update
  android-latest:
    if: github.ref == 'refs/heads/master'
    needs: android
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { name: android }
      - env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          mv exam-*-android.apk exam-android.apk
          gh release delete android-latest --cleanup-tag --yes -R "$GITHUB_REPOSITORY" || true
          gh release create android-latest exam-android.apk -R "$GITHUB_REPOSITORY" --prerelease --target "$GITHUB_SHA" \
            --title "Android build $GITHUB_RUN_NUMBER" --notes "Newest Android build from master ($GITHUB_SHA). The app checks this release on start."

  release:
    if: github.ref_type == 'tag'
    needs: [web, android]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
